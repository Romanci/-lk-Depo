<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factory ERP - AI Powered</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div id="app">
        <!-- Login Form -->
        <div id="login-section" class="flex items-center justify-center min-h-screen">
            <div class="bg-white p-8 rounded shadow-md w-96">
                <h2 class="text-2xl font-bold mb-6 text-center">Fabrika ERP Giriş</h2>
                <input type="text" id="username" placeholder="Kullanıcı Adı" class="w-full p-2 mb-4 border rounded">
                <input type="password" id="password" placeholder="Şifre" class="w-full p-2 mb-4 border rounded">
                <button onclick="login()" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Giriş Yap</button>
            </div>
        </div>

        <!-- Dashboard -->
        <div id="dashboard-section" class="hidden p-8">
            <div class="flex justify-between items-center mb-8">
                <h1 class="text-3xl font-bold">ERP Kontrol Paneli</h1>
                <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded">Çıkış</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Inventory -->
                <div class="bg-white p-6 rounded shadow">
                    <h2 class="text-xl font-semibold mb-4">Stok Durumu</h2>
                    <div id="inventory-list" class="space-y-2">
                        <!-- Inventory items will be loaded here -->
                    </div>
                </div>

                <!-- AI Forecast -->
                <div class="bg-white p-6 rounded shadow">
                    <h2 class="text-xl font-semibold mb-4">Yapay Zeka Talep Tahmini</h2>
                    <div id="ai-forecast" class="p-4 bg-blue-50 text-blue-800 rounded">
                        Tahmin verisi yüklemek için bir ürün seçin.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8000";
        let token = localStorage.getItem("token");

        if (token) {
            showDashboard();
        }

        async function login() {
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;

            const formData = new FormData();
            formData.append("username", user);
            formData.append("password", pass);

            const res = await fetch(`${API_URL}/token`, {
                method: "POST",
                body: formData
            });

            if (res.ok) {
                const data = await res.json();
                token = data.access_token;
                localStorage.setItem("token", token);
                showDashboard();
            } else {
                alert("Giriş başarısız!");
            }
        }

        function logout() {
            localStorage.removeItem("token");
            location.reload();
        }

        function showDashboard() {
            document.getElementById("login-section").classList.add("hidden");
            document.getElementById("dashboard-section").classList.remove("hidden");
            loadInventory();
        }

        async function loadInventory() {
            const res = await fetch(`${API_URL}/inventory`, {
                headers: { "Authorization": `Bearer ${token}` }
            });
            const data = await res.json();
            const list = document.getElementById("inventory-list");
            list.innerHTML = data.map(item => `
                <div class="flex justify-between border-b py-2 cursor-pointer hover:bg-gray-50" onclick="loadForecast(${item.id})">
                    <span>${item.name} (SKU: ${item.sku})</span>
                    <span class="font-bold">${item.stock_quantity} Adet</span>
                </div>
            `).join("");
        }

        async function loadForecast(productId) {
            const res = await fetch(`${API_URL}/ai/forecast/${productId}`, {
                headers: { "Authorization": `Bearer ${token}` }
            });
            const data = await res.json();
            document.getElementById("ai-forecast").innerHTML = `
                <p><strong>Ürün ID:</strong> ${data.product_id}</p>
                <p><strong>Gelecek Ay Tahmini:</strong> ${Math.round(data.forecasted_demand_next_month)} adet</p>
                <p class="text-sm mt-2 italic">Kaynak: ${data.data_source}</p>
            `;
        }
    </script>
</body>
</html>
